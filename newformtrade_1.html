<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeFlow | Registration</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #080d16;
  color: white;
  padding: 25px 15px;
}

.container {
  max-width: 480px;
  margin: 20px auto;
  background: #111a29;
  padding: 28px 22px;
  border-radius: 16px;
  border: 1px solid #26354b;
}

.logo {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  color: #27d9a0;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #a7b4c7;
  font-size: 13px;
  margin-bottom: 25px;
  line-height: 1.6;
}

h2 {
  text-align: center;
  margin-bottom: 22px;
  font-size: 21px;
}

label {
  display: block;
  margin: 16px 0 8px;
  font-size: 13px;
  color: #dce5f2;
}

input, select {
  width: 100%;
  padding: 14px;
  background: #091321;
  color: white;
  border: 1px solid #33445c;
  border-radius: 8px;
  outline: none;
  font-size: 14px;
}

input:focus, select:focus {
  border-color: #27d9a0;
}

select option {
  background: #111a29;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  line-height: 1.5;
}

.consent input {
  width: auto;
  margin-top: 3px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 25px;
  background: #20c997;
  color: #07130f;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #16b889;
}

.note {
  margin-top: 20px;
  font-size: 11px;
  color: #8f9db0;
  text-align: center;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: #77869b;
  font-size: 11px;
  margin-top: 22px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">TRADEFLOW</div>

  <div class="subtitle">
    Trading Interest Registration<br>
    Complete the form to discuss your trading interests.
  </div>

  <h2>Registration Form</h2>

  <form id="tradeForm">

    <label>Full Name</label>
    <input type="text" id="name"
    placeholder="Enter your full name" required>

    <label>Contact Number</label>
    <input type="tel" id="contact"
    placeholder="Enter your phone number"
    pattern="[0-9]{10}" maxlength="10" required>

    <label>Age</label>
    <input type="number" id="age"
    placeholder="Enter your age"
    min="18" max="100" required>

    <label>City</label>
    <input type="text" id="city"
    placeholder="Enter your city" required>

    <label>Are you trading for the first time?</label>
    <select id="firstTime" required>
      <option value="">Select an option</option>
      <option>Yes, I am a beginner</option>
      <option>No, I have trading experience</option>
    </select>

    <label>What is your investment budget?</label>
    <select id="budget" required>
      <option value="">Select your budget</option>
      <option>₹800 - ₹1,000</option>
      <option>₹1,000 - ₹2,000</option>
      <option>₹2,000 - ₹3,000</option>
      <option>₹3,000 - ₹4,000</option>
      <option>₹4,000 - ₹5,000</option>
    </select>

    <label class="consent">
      <input type="checkbox" id="consent" required>
      I agree to be contacted on WhatsApp about my registration.
    </label>

    <button type="submit">
      SUBMIT REGISTRATION →
    </button>

  </form>

  <div class="note"></div>

  <div class="footer">
    © 2026 TradeFlow. All Rights Reserved.
  </div>

</div>

<script>

const whatsappNumber = "27740221087";

document.getElementById("tradeForm").addEventListener(
"submit", function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const age = Number(document.getElementById("age").value);
  const city = document.getElementById("city").value.trim();

  if (age < 18 || age > 100) {
    alert("Registration is only available for adults aged 18 or above.");
    return;
  }

  if (!/^[0-9]{10}$/.test(contact)) {
    alert("Please enter a valid 10-digit contact number.");
    return;
  }

  const message = `
TRADEFLOW - NEW REGISTRATION

Name: ${name}
Contact: ${contact}
Age: ${age}
City: ${city}

First Time Trading:
${document.getElementById("firstTime").value}

Investment Budget:
${document.getElementById("budget").value}
`;

  const url = "https://wa.me/" + whatsappNumber +
  "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");

});

</script>

</body>
</html>
